name: Release

# Every push to main becomes a release: GoldenIce is built, signed with Developer ID, notarized,
# packaged as a zip and a DMG, and published on GitHub with a new appcast.xml, which is where
# installed copies look for updates. Nothing about the signing identity is in the repository;
# it all comes from the repository's encrypted secrets (see docs/RELEASING.md).
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

# One release at a time, in the order of the pushes.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # GoldenIce is built for macOS 27, which needs Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The project's MARKETING_VERSION without its last number is the base, such as
          # 0.11.13-goldengate; each release adds one to the highest number released on it.
          PROJECT_VERSION="$(sed -n 's/.*MARKETING_VERSION = "\{0,1\}\([^";]*\)"\{0,1\};/\1/p' Ice.xcodeproj/project.pbxproj | grep -v '^1\.0$' | head -1)"
          BASE="${PROJECT_VERSION%.*}"
          LAST="$(git tag --list "v$BASE.*" | sed "s/^v$BASE\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)"
          VERSION="$BASE.$(( ${LAST:-0} + 1 ))"
          # Sparkle compares the build number, which must only ever go up. 2700 was the last
          # one built by hand.
          BUILD="$(( 2700 + GITHUB_RUN_NUMBER ))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing GoldenIce $VERSION ($BUILD)"

      - name: Install the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::The certificate in DEVELOPER_ID_P12 is not a Developer ID Application identity"; exit 1; }

      - name: Write the notarization and update keys
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -n "$NOTARY_KEY" ]; then
            echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          fi
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"

      - name: Fetch the current appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The new appcast lists earlier versions too, so they are taken from the latest release.
          mkdir -p build/releases
          gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir build/releases 2>/dev/null \
            || echo "No earlier appcast; this is the first release"

      - name: Build, sign and notarize
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/notary.p8" ]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          fi
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key" Scripts/release.sh --appcast

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GoldenIce $VERSION" \
            --generate-notes \
            --latest \
            "build/releases/GoldenIce-$VERSION.dmg" \
            "build/releases/GoldenIce-$VERSION.zip" \
            "build/releases/appcast.xml"

      - name: Remove the keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
